<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Punch the Monkey News</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      border-bottom: 2px solid #7c3aed;
      padding: 14px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      color: #c084fc;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 2px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 90%;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .msg.assistant {
      background: #1e1e2e;
      border: 1px solid #374151;
      align-self: flex-start;
    }

    .msg.user {
      background: #4c1d95;
      align-self: flex-end;
      text-align: right;
    }

    .msg.system {
      background: #1f2937;
      border: 1px solid #4b5563;
      align-self: center;
      text-align: center;
      font-size: 0.8rem;
      color: #9ca3af;
      max-width: 100%;
    }

    .msg h1, .msg h2, .msg h3 { color: #c084fc; margin: 8px 0 4px; font-size: 1rem; }
    .msg ul, .msg ol { padding-left: 18px; margin: 6px 0; }
    .msg li { margin: 3px 0; }
    .msg p { margin: 4px 0; }
    .msg hr { border-color: #374151; margin: 8px 0; }
    .msg strong { color: #e2e8f0; }
    .msg code { background: #111827; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }

    .tokens {
      font-size: 0.7rem;
      color: #6b7280;
      margin-top: 6px;
      text-align: right;
    }

    #input-area {
      background: #111827;
      border-top: 1px solid #374151;
      padding: 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 10px 14px;
      color: #f0f0f0;
      font-size: 0.95rem;
      resize: none;
      max-height: 100px;
      outline: none;
      font-family: inherit;
    }

    #user-input:focus { border-color: #7c3aed; }

    #send-btn {
      background: #7c3aed;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #send-btn:disabled { background: #374151; cursor: not-allowed; }

    #briefing-btn {
      display: block;
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    #briefing-btn:hover { background: #6d28d9; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #4b5563;
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>🐒 Punch the Monkey</h1>
    <p>News & Updates Tracker</p>
  </header>

  <div id="chat">
    <div class="msg system">
      Tap <strong>Get Briefing</strong> for the latest news, or ask a question below.
    </div>
    <button id="briefing-btn" onclick="getBriefing()">Get Briefing</button>
  </div>

  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Ask a follow-up question…"></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled>&#9654;</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let briefingDone = false;

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
      sendBtn.disabled = !input.value.trim() || !briefingDone;
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function appendMsg(role, html, tokens) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = html;
      if (tokens) {
        const t = document.createElement('div');
        t.className = 'tokens';
        t.textContent = `${tokens.input} in / ${tokens.output} out tokens`;
        div.appendChild(t);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function appendLoading() {
      return appendMsg('system', '<span class="spinner"></span> Thinking…');
    }

    async function getBriefing() {
      const btn = document.getElementById('briefing-btn');
      btn.disabled = true;
      btn.textContent = 'Loading…';
      const loader = appendLoading();

      const res = await fetch('/briefing', { method: 'POST' });
      const data = await res.json();
      loader.remove();
      btn.remove();

      if (data.error) {
        appendMsg('system', `Error: ${data.error}`);
        return;
      }

      appendMsg('assistant', marked.parse(data.reply), { input: data.input_tokens, output: data.output_tokens });
      briefingDone = true;
      sendBtn.disabled = !input.value.trim();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMsg('user', text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const loader = appendLoading();

      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      loader.remove();

      if (data.error) {
        appendMsg('system', `Error: ${data.error}`);
        return;
      }

      appendMsg('assistant', marked.parse(data.reply), { input: data.input_tokens, output: data.output_tokens });
    }
  </script>
</body>
</html>
